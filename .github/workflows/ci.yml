name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install (CPU PyTorch)
        run: uv sync --locked --extra cpu --python 3.12

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Links in the docs
        run: .venv/bin/python tests/check_links.py

      - name: Unit tests
        run: .venv/bin/python -m pytest -q tests

      - name: Smoke test (split, 1 federated round, explanations)
        run: bash tests/smoke_test.sh
